# Categories for the catalog-builder sweep.
#
# Each category becomes one sub-agent's work unit. The orchestrator
# dispatches one Sonnet sub-agent per category in parallel; each agent
# researches its own list and writes its own staging file
# (`staging/{id}.yaml`). No two agents touch the same file.
#
# `examples` are seed companies the agent starts with. The agent is
# expected to expand the list to ~15-25 companies per category using
# WebSearch — these are just primers so it knows the shape of the
# category. Skew toward well-known companies that users would actually
# recognise and want to track.

categories:
  - id: ai-labs
    label: "AI / ML labs and platforms"
    examples: ["Anthropic", "OpenAI", "Cohere", "Mistral AI", "Hugging Face", "Inflection AI", "Character.AI", "Adept", "Perplexity"]

  - id: devtools-infra
    label: "Developer tools — infrastructure and observability"
    examples: ["Cloudflare", "Vercel", "Netlify", "Datadog", "Sentry", "GitHub", "GitLab", "Fly.io", "Render"]

  - id: devtools-saas
    label: "Developer / productivity SaaS"
    examples: ["Notion", "Linear", "Figma", "Slack", "Atlassian", "Loom", "1Password", "Postman"]

  - id: fintech-payments
    label: "Fintech — payments and banking infrastructure"
    examples: ["Stripe", "Plaid", "Mercury", "Modern Treasury", "Block", "Adyen", "Brex"]

  - id: fintech-consumer
    label: "Fintech — consumer-facing (neobanks, lending, BNPL)"
    examples: ["Chime", "SoFi", "Affirm", "Ramp", "Robinhood", "Wealthfront", "Klarna"]

  - id: crypto
    label: "Crypto, blockchain, web3"
    examples: ["Coinbase", "Kraken", "Circle", "Chainalysis", "Anchorage", "Ledger", "OpenSea"]

  - id: hotels
    label: "Hotels and hospitality"
